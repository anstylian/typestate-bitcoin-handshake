[package]
name = "typestate-bitcoin-handshake"
version = "0.1.0"
edition = "2021"

[dependencies]
argh = "0.1.19"
bitcoin = "0.32.102"
bytes = "1.12.1"
eyre = "0.6.14"
futures = "0.3.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
tokio-stream = { version = "0.1.19" }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
